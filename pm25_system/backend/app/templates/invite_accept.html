{% extends 'base.html' %}

{% block title %}Accept Invite{% endblock %}

{% block content %}
  <h1>Accept Invite</h1>
  {% if message %}
    <p style="color:red">{{ message }}</p>
  {% endif %}
  <form method="post" action="/ui/auth/invite/accept">
    <label for="token">Invite token</label><br />
    <input id="token" name="token" type="text" value="{{ token or '' }}" required /><br />
    <label for="name">Full name</label><br />
    <input id="name" name="name" type="text" required /><br />
    <label for="email">Email</label><br />
    <input id="email" name="email" type="email" required /><br />
    <label for="password">Password</label><br />
    <input id="password" name="password" type="password" required /><br />
    <button type="submit">Accept invite</button>
  </form>
  <p><a href="/ui/auth/login">Back to login</a></p>
{% endblock %}
